<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Chill Ciao Lab</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans TC", sans-serif;
      background: #f7f9fc;
      color: #222;
    }

    header {
      background: white;
      border-bottom: 1px solid #dbe5f0;
      padding: 24px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin-top: 8px;
      color: #666;
    }

    main {
      max-width: 700px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .course-card {
      background: white;
      border: 1px solid #dbe5f0;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
    }

    .course-card h2 {
      margin-top: 0;
    }

    .course-card p {
      color: #666;
      line-height: 1.6;
    }

    .button {
      display: inline-block;
      margin-top: 12px;
      padding: 12px 20px;
      background: #3778b8;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #888;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <header>
    <h1>Chill Ciao Lab</h1>
    <p>English Practice</p>
  </header>

  <main>

    <div class="course-card">
      <h2>GEPT Elementary</h2>

      <p>
        課後英文複習區<br>
        Review what you learned in class.
      </p>

      <a class="button" href="#">
        Start Practice
      </a>
    </div>

  </main>

  <footer>
    Chill Ciao Lab © 2026
  </footer>

</body>
</html>
